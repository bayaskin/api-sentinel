
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src tests

      - name: Run tests with coverage
        run: pytest --cov=api_sentinel --cov-report=term-missing --cov-fail-under=90

      - name: Run local API smoke tests
        run: |
          python examples/mock_api.py > /tmp/api-sentinel-mock.log 2>&1 &
          echo $! > /tmp/api-sentinel-mock.pid

          for i in {1..20}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/status/200', timeout=1)" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done

          api-sentinel run examples/local-tests.yaml --junit-xml report.xml

          api-sentinel security examples/security-tests.yaml \
            --junit-xml security-report.xml || status=$?

          test "${status:-0}" -eq 1

          python -c "
          from xml.etree import ElementTree as ET
          root = ET.parse('security-report.xml').getroot()
          assert root.attrib['tests'] == '3'
          assert root.attrib['failures'] == '2'
          assert root.attrib['errors'] == '0'
          "

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sentinel-junit-report
          path: report.xml
          if-no-files-found: warn

      - name: Upload security JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sentinel-security-report
          path: security-report.xml
          if-no-files-found: warn

      - name: Build Python distributions
        run: python -m build

      - name: Verify clean installation
        run: |
          python -m venv /tmp/api-sentinel-clean
          /tmp/api-sentinel-clean/bin/python -m pip install dist/*.whl

          python examples/mock_api.py > /tmp/api-sentinel-mock.log 2>&1 &
          MOCK_API_PID=$!
          trap 'kill "$MOCK_API_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/status/200 > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:8765/status/200 > /dev/null

          /tmp/api-sentinel-clean/bin/api-sentinel run \
            examples/local-tests.yaml \
            --junit-xml clean-install-report.xml

      - name: Upload clean-install report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sentinel-clean-install-report
          path: clean-install-report.xml
          if-no-files-found: warn

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: api-sentinel-distributions
          path: dist/
          if-no-files-found: error