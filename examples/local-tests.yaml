
base_url: http://127.0.0.1:8765

tests:
  - name: Local health endpoint succeeds
    request:
      method: GET
      path: /status/200
    expect:
      status: 200

  - name: Local JSON endpoint succeeds
    request:
      method: GET
      path: /json
    expect:
      status: 200

  - name: Local JSON response contains slideshow author
    request:
      method: GET
      path: /json
    expect:
      status: 200
      json:
        slideshow.author: "Yours Truly"
        slideshow.slides: 2
