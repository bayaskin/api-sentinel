
base_url: https://httpbin.org

tests:
  - name: GET request succeeds
    request:
      method: GET
      path: /status/200
    expect:
      status: 200

  - name: JSON response succeeds
    request:
      method: GET
      path: /json
    expect:
      status: 200

  - name: JSON response contains slideshow author
    request:
      method: GET
      path: /json
    expect:
      status: 200
      json:
        slideshow.author: "Yours Truly"